name: Bai4 Selenium Grid (Docker)

on:
  push:
    branches: [main]
    paths:
      - 'bai4/**'
      - '.github/workflows/bai4-grid.yml'
  workflow_dispatch:

jobs:
  # ─── Job A: local tests (no Docker needed, quick smoke) ───────────────────
  local-tests:
    name: Local Chrome Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run local smoke tests
        working-directory: bai4
        run: mvn test -DsuiteXmlFile=testng.xml

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-surefire-reports
          path: bai4/target/surefire-reports/
          if-no-files-found: ignore

  # ─── Job B: Grid tests (Docker Hub + Nodes) ───────────────────────────────
  grid-tests:
    name: Grid Parallel Tests (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Start Selenium Grid
        working-directory: bai4
        run: |
          docker compose up -d
          echo "Waiting for Selenium Hub to be ready..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s http://localhost:4444/status | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('value',{}).get('ready','false'))" 2>/dev/null)
            echo "Attempt $i: ready=$STATUS"
            if [ "$STATUS" = "True" ]; then
              echo "Hub is ready!"
              break
            fi
            sleep 3
          done

      - name: Show Grid status
        run: |
          curl -s http://localhost:4444/status | python3 -m json.tool || true
          docker compose -f bai4/docker-compose.yml ps

      - name: Run parallel Grid tests
        working-directory: bai4
        run: |
          mvn test \
            -DsuiteXmlFile=testng-grid.xml \
            -Dgrid.url=http://localhost:4444 \
            -Dbrowser=chrome

      - name: Upload Grid reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grid-surefire-reports
          path: bai4/target/surefire-reports/
          if-no-files-found: ignore

      - name: Stop Grid
        if: always()
        working-directory: bai4
        run: docker compose down
