# .github/workflows/selenium-full.yml - Pipeline hoàn chỉnh
name: Full Selenium CI Pipeline

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1-5'   # 2AM mỗi ngày trong tuần
  workflow_dispatch:

# Cần quyền ghi nội dung để simple-elf/allure-report-action đẩy lên gh-pages
permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Chạy tests (matrix chrome + firefox), upload allure-results
  # ─────────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, firefox]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: maven }

      - name: Install Chrome
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@v1

      - name: Install Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1

      - name: Run tests
        working-directory: bai5
        run: mvn clean test -Dbrowser=${{ matrix.browser }} -DsuiteXmlFile=testng-smoke.xml
        env:
          APP_USERNAME: ${{ secrets.SAUCEDEMO_USERNAME }}
          APP_PASSWORD: ${{ secrets.SAUCEDEMO_PASSWORD }}

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: bai5/target/allure-results/
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Gộp kết quả, tạo Allure Report và publish lên GitHub Pages
  # ─────────────────────────────────────────────────────────────────────────
  publish-report:
    needs: test           # Chạy sau khi tất cả job test xong
    if: always()          # Chạy kể cả khi test fail
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Chrome results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-chrome
          path: allure-results/
        continue-on-error: true

      - name: Download Firefox results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-firefox
          path: allure-results/
        continue-on-error: true

      - name: Generate & Publish Allure Report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          keep_reports: 20
